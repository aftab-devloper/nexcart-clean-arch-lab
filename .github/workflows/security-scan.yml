name: Security Scan
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
  security-events: write
  id-token: write
jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nexcart-clean-arch-lab:${{ github.sha }} .
      - name: Run Trivy (table view for logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexcart-clean-arch-lab:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Run Trivy (SARIF for security gate)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: nexcart-clean-arch-lab:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: 1
      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      - name: Generate SBOM
        run: |
          docker run --rm -v ${{ github.workspace }}:/output aquasecurity/trivy image --format cyclonedx --output /output/sbom.json nexcart-clean-arch-lab:${{ github.sha }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image with cosign (keyless)
        run: cosign sign --yes nexcart-clean-arch-lab:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"