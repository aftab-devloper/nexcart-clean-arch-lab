name: Security Scan
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
  security-events: write
jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nexcart-clean-arch-lab:${{ github.sha }} .
      - name: Run Trivy (table view for logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexcart-clean-arch-lab:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 0
      - name: Run Trivy (SARIF for security gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexcart-clean-arch-lab:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: 1
      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif