name: Semgrep SAST

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude node_modules \
            --exclude .next \
            --exclude build \
            --exclude dist
