name: Attest Source Artifact

on:
  push:
    branches: ["master", "feat/*", "feat/**"]

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  attest-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: tar --warning=no-file-changed -czf nexcart-source.tar.gz --exclude='.git' . || true

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: nexcart-source.tar.gz

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: nexcart-source
          path: nexcart-source.tar.gz
